name: sentinel-wif-probe

# P5-C WIF capability-probe plumbing (P5-B Part 3/3). Implemented here;
# NEVER executed by Part 3. Every retryable preflight runs and must
# pass BEFORE the immutable one-shot marker is uploaded; OIDC/provider
# activity is reachable only after that marker is confirmed visible.
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Exact 40-lowercase-hex commit SHA this probe is running against"
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: sentinel-oneshot-p5c
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'kobescak-kristian/ai-portfolio-sentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.SENTINEL_P5C_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: preflight
        id: preflight
        run: >
          python scripts/run_phase5_wif_probe.py preflight
          --expected-source-sha "${{ inputs.expected_source_sha }}"
          --work-root "$WORK_ROOT"
          --marker-out "$WORK_ROOT/marker.json"
          --fx-state-path "$WORK_ROOT/fx-state.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic_identity_token
          WORK_ROOT: ${{ runner.temp }}/p5-probe
      - name: upload one-shot marker
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sentinel-p5-oneshot-p5c-wif-probe-r${{ github.run_id }}
          path: ${{ runner.temp }}/p5-probe/marker.json
          retention-days: 90
          if-no-files-found: error
      - name: execute
        id: execute
        run: >
          python scripts/run_phase5_wif_probe.py execute
          --expected-source-sha "${{ inputs.expected_source_sha }}"
          --work-root "$WORK_ROOT"
          --fx-state-path "$WORK_ROOT/fx-state.json"
          --evidence-out "$WORK_ROOT/probe-evidence.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic_identity_token
          WORK_ROOT: ${{ runner.temp }}/p5-probe
      - name: upload probe evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sentinel-p5-probe-evidence-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/p5-probe/probe-evidence.json
          retention-days: 90
          if-no-files-found: error
